# AI Gateway — Example Configuration
# ────────────────────────────────────────────────────────────────────────────
#
# Place this file at config/gateway.yaml or pass the path as the first
# CLI argument: ai-gateway path/to/config.yaml

server:
  host: "127.0.0.1" # loopback only: required while llama_server is enabled
  port: 8999
  body_limit_bytes: 52428800 # 50 MB
  shutdown_timeout_secs: 30

# ─── Providers ──────────────────────────────────────────────────────────────
# Each provider has a name, type, base URL, and optional API key.

providers:
  llama:
    name: llama
    type: llama_cpp
    base_url: "http://localhost:8080"
    timeout_secs: 300

  openrouter:
    name: openrouter
    type: open_router
    base_url: "https://openrouter.ai/api"
    api_key_env: OPENROUTER_API_KEY
    timeout_secs: 120

  ollama:
    name: ollama
    type: ollama
    base_url: "http://localhost:11434"
    timeout_secs: 300

  # Keys come from the environment (.env is loaded at startup - see .env.example).
  # A provider whose key is unset shows as unhealthy; the gateway still starts.

  ollama_cloud:
    name: ollama_cloud
    type: ollama_cloud
    base_url: "https://ollama.com"
    api_key_env: OLLAMA_API_KEY
    timeout_secs: 300

  gemini:
    name: gemini
    type: gemini
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: GEMINI_API_KEY
    timeout_secs: 120

  huggingface:
    name: huggingface
    type: hugging_face
    base_url: "https://router.huggingface.co/v1"
    api_key_env: HF_API_KEY
    timeout_secs: 120

  # vllm:
  #   name: vllm
  #   type: vllm
  #   base_url: "http://localhost:8000"
  #   timeout_secs: 300

# ─── Models ─────────────────────────────────────────────────────────────────
# Each model is an alias that maps to one or more provider/model candidates.
# Candidates are tried in priority order (lower = higher priority).

models:
  coding-fast:
    name: coding-fast
    description: "Fast coding model — prefers local inference"
    candidates:
      - provider: llama
        model: qwen3.5-9b
        priority: 1
      - provider: openrouter
        model: qwen/qwen3.5-35b
        priority: 2
    capabilities:
      tools: true
      streaming: true
      structured_output: true

  coding-strong:
    name: coding-strong
    description: "Strong coding model — cloud frontier"
    candidates:
      - provider: openrouter
        model: xiaomi/mimo-v2.6-flash
        priority: 1
    capabilities:
      tools: true
      vision: true
      reasoning: true
      streaming: true
      structured_output: true

  general:
    name: general
    description: "General purpose model"
    candidates:
      - provider: llama
        model: qwen3.5-9b
        priority: 1
      - provider: ollama
        model: qwen3.5:9b
        priority: 2
      - provider: openrouter
        model: xiaomi/mimo-v2.6-flash
        priority: 3
    capabilities:
      tools: true
      streaming: true

# ─── Routing ────────────────────────────────────────────────────────────────

routing:
  default_policy: ordered
  max_retries_per_provider: 2
  fallback_on:
    - timeout
    - rate_limit
    - unavailable
    - server_error
  attempt_timeout_secs: 120

# ─── Telemetry ──────────────────────────────────────────────────────────────

telemetry:
  enabled: true
  database_url_env: DATABASE_URL
  pool_size: 10
  batch_size: 100
  flush_interval_ms: 1000
  store_raw_bodies: true
  store_stream_events: true
  # fallback_log_path: telemetry_fallback.jsonl

# ─── llama-server management (optional, off by default) ───────────────────────
# Lets the gateway (and its UI) save models, start/stop llama-server, and show
# what is loaded. This is the only feature that launches a local process, so it
# requires server.host to be loopback (127.0.0.1) unless allow_non_loopback is
# set. Point `binary` at the real .exe, not a .cmd shim. Keep `port` equal to
# the `llama` provider's port above. See docs/CONFIGURATION_GUIDE.md.
#
llama_server:
  enabled: true
  binary: 'S:\llama.cpp\build\bin\Release\llama-server.exe'
  host: 127.0.0.1
  port: 8080 # must match the `llama` provider's port above
  state_file: config/llama_models.json
  scan_dirs: ['S:\Code\Models']
  start_timeout_secs: 300

# ─── Pricing (optional) ───────────────────────────────────────────────────────
# Keyed by "provider/model". A deployment with no entry here simply produces
# no cost_records row — never a fabricated zero cost.

